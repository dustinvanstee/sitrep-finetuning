# Evaluation Configuration for INDOPACOM SITREP Fine-Tuning (V2)
# Usage: python scripts/4_evaluate_model.py --config config/evaluation_config.yaml

# Test data configuration
test_data:
  path: "data/processed/val.jsonl"  # Validation set for evaluation

# Model paths
models:
  # Local baseline: Base model before fine-tuning (runs on GPU)
  baseline:
    path: "nvidia/Nemotron-Mini-4B-Instruct"  # Base model (HuggingFace)
  
  # Fine-tuned: Your trained LoRA adapter (runs on GPU)
  finetuned:
    path: "outputs/checkpoints/latest"  # LoRA adapter path after training
    # Alternative: full merged model path
  
  # Cloud baseline: Large cloud-hosted model as "gold standard" reference
  # Helps answer: "Does fine-tuning a small 4B model achieve comparable quality to a 49B model?"
  cloud_baseline:
    enabled: true  # Set to false to skip cloud baseline evaluation
    name: "Nemotron-Super-49B"  # Display name in reports/visualizations
    model: "nvidia/llama-3.3-nemotron-super-49b-v1.5"
    # Uses NVIDIA API - requires NVIDIA_API_KEY env var
    base_url: "https://integrate.api.nvidia.com/v1"
    # api_key: null  # Uses NVIDIA_API_KEY env var by default
    system_prompt: "/think"  # Enable chain-of-thought reasoning
    temperature: 0.6
    top_p: 0.95
    max_tokens: 4096

# Generation parameters for local models (baseline and finetuned)
generation:
  max_new_tokens: 4096
  temperature: 0.7
  top_p: 0.9
  top_k: 50
  repetition_penalty: 1.1
  do_sample: true

# Instruction prompt prepended to all inputs for consistent evaluation
# This mirrors the guidance used during synthetic data generation
# Use --no-instruction-prompt flag to disable
instruction_prompt: |
  You are a military operations officer. Based on the following intelligence inputs, generate a consolidated Situation Report (SITREP).

  FORMAT REQUIREMENTS:
  - Use NUMBERED section headers exactly as shown: "1. BLUF", "2. FRIENDLY FORCES", etc.
  - Separate sections with "---" dividers
  - Use bullet points with "-" for list items

  REQUIRED SECTIONS:
  1. BLUF (Bottom Line Up Front) - 2-4 bullet points with confidence level and probability assessment
  2. FRIENDLY FORCES - Status and readiness assessment
  3. ADVERSARY ACTIVITY - Enemy actions and threat assessment
  4. OPERATIONS - Current and planned operations
  5. LOGISTICS - Supply status and shortfalls
  6. INTELLIGENCE ASSESSMENT - Key findings, information gaps, analyst judgment
  7. RISKS / WATCH ITEMS - Key risks and concerns
  8. COMMANDER'S COMMENTS - Guidance and priority focus

  Generate ONLY the SITREP using the exact numbered format above. No additional commentary.

  === INTELLIGENCE INPUTS ===

# LLM Judge configuration
# The judge evaluates the quality of generated SITREPs
judge:
  # Provider options: nvidia, openai, anthropic, local-nim, ollama
  provider: "nvidia"
  
  # Model name - using same model as cloud baseline (confirmed working)
  model: "nvidia/llama-3.3-nemotron-super-49b-v1.5"
  
  # Lower temperature for more consistent evaluation
  temperature: 0.3
  
  # Optional: API key (can also use env vars)
  # NVIDIA_API_KEY, OPENAI_API_KEY, ANTHROPIC_API_KEY
  # api_key: null
  
  # Optional: custom base URL
  # For local-nim: http://localhost:8000/v1
  # For ollama: http://localhost:11434/v1
  # base_url: null

# Output configuration
output:
  save_dir: "outputs/evaluation_results_v2"
  save_visualizations: true
  save_comparison_report: true

# Processing options
processing:
  device: "auto"  # or "cuda:0", "cpu"
